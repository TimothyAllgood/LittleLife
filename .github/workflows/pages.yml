name: Publish Little Life to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check assets/game.js
          node --check assets/legacy-rewrites.js
          node --check assets/childhood.js
          node --check assets/later-life.js
          node --check assets/passive-life.js
          node --check assets/career-stories.js
          node --check assets/hobby-world.js
          node --check assets/world-social.js
          node --check assets/personality-world.js
          node --check assets/story-pass.js
          node --check assets/legacy-outcomes.js
          python3 tests/smoke.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4